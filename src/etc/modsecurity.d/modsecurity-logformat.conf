# Environment variables consumed by the log format from
# https://www.netnea.com/cms/apache-tutorial-6_embedding-modsecurity/
#
# The rule stays commented out until USE_FOLINIS_MODSEC_LOGFORMAT is set to
# "true", at which point the entrypoint strips the #LOGFORMAT# markers and
# ModSecurity loads it. Anyone on the standard log format pays nothing for a
# phase 5 rule whose values would only ever be discarded.
#
# ApplicationTime stays empty unless something sets TX.ModSecTimestamp2end and
# TX.ModSecTimestamp3start, which is also true of the upstream tutorial.
#
# The per-paranoia-level scores use the CRS 4 names, tx.inbound_anomaly_score_plN;
# the tutorial predates that rename and its tx.anomaly_score_plN logs as "---".
#LOGFORMAT#SecAction "id:90100,phase:5,pass,nolog,\
#LOGFORMAT#  setvar:TX.perf_modsecinbound=%{PERF_PHASE1},\
#LOGFORMAT#  setvar:TX.perf_modsecinbound=+%{PERF_PHASE2},\
#LOGFORMAT#  setvar:TX.perf_application=%{TX.ModSecTimestamp3start},\
#LOGFORMAT#  setvar:TX.perf_application=-%{TX.ModSecTimestamp2end},\
#LOGFORMAT#  setvar:TX.perf_modsecoutbound=%{PERF_PHASE3},\
#LOGFORMAT#  setvar:TX.perf_modsecoutbound=+%{PERF_PHASE4},\
#LOGFORMAT#  setenv:ModSecTimeIn=%{TX.perf_modsecinbound},\
#LOGFORMAT#  setenv:ApplicationTime=%{TX.perf_application},\
#LOGFORMAT#  setenv:ModSecTimeOut=%{TX.perf_modsecoutbound},\
#LOGFORMAT#  setenv:ModSecAnomalyScoreInPLs=%{tx.inbound_anomaly_score_pl1}-%{tx.inbound_anomaly_score_pl2}-%{tx.inbound_anomaly_score_pl3}-%{tx.inbound_anomaly_score_pl4},\
#LOGFORMAT#  setenv:ModSecAnomalyScoreOutPLs=%{tx.outbound_anomaly_score_pl1}-%{tx.outbound_anomaly_score_pl2}-%{tx.outbound_anomaly_score_pl3}-%{tx.outbound_anomaly_score_pl4},\
#LOGFORMAT#  setenv:ModSecAnomalyScoreIn=%{TX.anomaly_score},\
#LOGFORMAT#  setenv:ModSecAnomalyScoreOut=%{TX.outbound_anomaly_score}"
