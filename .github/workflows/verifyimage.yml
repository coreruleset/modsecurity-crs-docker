---
name: Verify Images
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # sha256sum format: <hash><space><format (space for text)><file name>
  MODSECURITY_RECOMMENDED: "3c48278f2746593bb98ba342cc0c9eeb0ee447829c1f74bad8756770afd8533a  modsecurity.conf-recommended"
  GO_FTW_VERSION: '2.4.0'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Generate matrix
        id: generate
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # ratchet:docker/bake-action/subaction/matrix@v7.3.0
        with:
          target: default
          fields: platforms
      - name: Check modsecurity recommended
        run: |
          curl -sSL https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/v3/master/modsecurity.conf-recommended -o modsecurity.conf-recommended
          echo '${{ env.MODSECURITY_RECOMMENDED }}' > sha256sum.txt
          sha256sum -c sha256sum.txt

  build:
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    needs:
      - prepare
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # ratchet:docker/setup-qemu-action@v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.0

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # ratchet:docker/setup-buildx-action@v4.2.0
        with:
          driver-opts: image=moby/buildkit:master

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # ratchet:docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }}-verification
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # ratchet:docker/bake-action@v7.3.0
        with:
          files: |
            ./docker-bake.hcl
          targets: ${{ matrix.target }}
          # Build only the specified platform and tag as verification build.
          # Create a tar archive and load the image into Docker.
          set: |
            *.platform=${{ matrix.platforms }}
            ${{ matrix.target }}.tags=${{ matrix.target }}-verification
            *.output=type=docker,dest=${{ matrix.target }}-verification.tar
            *.output=type=docker
          push: false

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}-verification.tar
          path: ${{ matrix.target }}-verification.tar
          retention-days: 7
          overwrite: true

      - name: Run ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # get the major CRS version from the matrix.target
          # Targets ending with "previous" are v3; all others are v4.
          CRS_VERSION="$([[ "${TARGET}" == *-previous ]] && echo v3 || echo v4)"
          . .github/workflows/configure-rules-for-test.sh \
            "src/opt/modsecurity/configure-rules.${CRS_VERSION}.conf" \
            README.md \
            "${TARGET}.env"
          echo "Starting container ${TARGET}-verification"
          # The backend is a dummy
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-test" \
            --env-file "${TARGET}.env" \
            -p 8080:8080 \
            -p 8443:8443 \
            -e BACKEND=http://localhost:9999 \
            "${TARGET}-verification"

      - name: Verify ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          variant="apache"
          if grep -q "nginx" <<< "${TARGET}"; then
            variant="nginx"
          fi
          ./tests/verify-image.sh --variant "${variant}"

      - name: Verify HTTP/3 opt-in
        if: ${{ matrix.target == 'nginx-debian-writable-latest' && matrix.platforms == 'linux/amd64' }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "Starting container ${TARGET}-http3-test with HTTP3=on"
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-http3-test" \
            --env-file "${TARGET}.env" \
            -e BACKEND=http://localhost:9999 \
            -e HTTP3=on \
            -e HTTP3_ALT_SVC_PORT=8444 \
            -p 8081:8080 \
            -p 8444:8443 \
            -p 8444:8443/udp \
            "${TARGET}-verification"

          ./tests/verify-image.sh \
            --variant nginx \
            --url http://localhost:8081 \
            --tls-url https://localhost:8444 \
            --expect-h3-port 8444

          docker rm -f "${TARGET}-http3-test"

      - name: Verify proxy mTLS
        if: ${{ (matrix.target == 'apache-debian-latest' || matrix.target == 'nginx-debian-writable-latest') && matrix.platforms == 'linux/amd64' }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          variant="apache"
          cert_dir="/usr/local/apache2/conf"
          if grep -q "nginx" <<< "${TARGET}"; then
            variant="nginx"
            cert_dir="/etc/nginx/conf"
          fi

          # Client certificate signed by the test CA. Apache expects only the
          # leaf certificate in PROXY_SSL_CERT_FILE (see the README), so the
          # same files work for both variants.
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ca.key -out ca.crt -days 1 -subj "/CN=test-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes \
            -keyout proxy.key -out proxy.csr -subj "/CN=proxy"
          openssl x509 -req -in proxy.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 1 -out proxy.crt
          # Strip the trailing newline from the certificate to verify PEM concatenation
          head -c -1 proxy.crt > proxy-no-nl.crt
          mv proxy-no-nl.crt proxy.crt
          chmod 644 proxy.crt proxy.key

          # Self-signed server certificate for the backend; the WAF does not
          # verify the backend certificate (PROXY_SSL_VERIFY stays at its default).
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout backend.key -out backend.crt -days 1 -subj "/CN=backend"
          chmod 644 backend.crt backend.key

          # Backend that aborts the TLS handshake unless the client presents a
          # certificate chaining up to ca.crt. An allowed request returning the
          # s_server page below therefore proves that the client certificate
          # was presented and accepted.
          docker network create mtls-net
          docker run \
            --pull "never" \
            -d \
            --name mtls-backend \
            --network mtls-net \
            -v "${PWD}/backend.crt:/tls/backend.crt:ro" \
            -v "${PWD}/backend.key:/tls/backend.key:ro" \
            -v "${PWD}/ca.crt:/tls/ca.crt:ro" \
            -p 9443:9443 \
            --entrypoint openssl \
            "${TARGET}-verification" \
            s_server -accept 9443 -cert /tls/backend.crt -key /tls/backend.key \
              -Verify 1 -CAfile /tls/ca.crt -www

          echo "Starting container ${TARGET}-mtls-test with PROXY_SSL=on"
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-mtls-test" \
            --network mtls-net \
            --env-file "${TARGET}.env" \
            -e BACKEND=https://mtls-backend:9443 \
            -e PROXY_SSL=on \
            -v "${PWD}/proxy.crt:${cert_dir}/proxy.crt:ro" \
            -v "${PWD}/proxy.key:${cert_dir}/proxy.key:ro" \
            -p 8081:8080 \
            -p 8444:8443 \
            "${TARGET}-verification"

          ./tests/verify-image.sh \
            --variant "${variant}" \
            --url http://localhost:8081 \
            --tls-url https://localhost:8444

          docker logs "${TARGET}-mtls-test" 2>&1 | grep -q "using proxy client certificate"

          # An allowed request has to reach the mTLS backend and come back with its page
          curl -sS --fail --retry 8 --retry-delay 2 --retry-all-errors \
            http://localhost:8081/ | grep -q "s_server"

          # Negative control: the backend rejects connections without a client certificate
          if curl -sk --max-time 5 https://localhost:9443/ > /dev/null 2>&1; then
            echo "the mTLS backend accepted a connection without a client certificate"
            exit 1
          fi

          # A configured path that does not hold both files has to stop the container
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-mtls-missing-test" \
            --env-file "${TARGET}.env" \
            -e PROXY_SSL=on \
            -e PROXY_SSL_CERT_FILE=/nonexistent/proxy.crt \
            -e PROXY_SSL_CERT_KEY_FILE=/nonexistent/proxy.key \
            "${TARGET}-verification"
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "${TARGET}-mtls-missing-test")" = "false"
          test "$(docker inspect -f '{{.State.ExitCode}}' "${TARGET}-mtls-missing-test")" != "0"
          docker logs "${TARGET}-mtls-missing-test" 2>&1 | grep -q "does not point to both existing files"

          docker rm -f "${TARGET}-mtls-test" "${TARGET}-mtls-missing-test" mtls-backend
          docker network rm mtls-net
          rm -f proxy.crt proxy.key proxy.csr backend.crt backend.key ca.crt ca.key ca.srl

      - name: Verify server-side mTLS opt-in
        if: ${{ (matrix.target == 'apache-debian-latest' || matrix.target == 'nginx-debian-writable-latest') && matrix.platforms == 'linux/amd64' }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          verify="on"
          cert_dir="/etc/nginx/ssl"
          if grep -q "apache" <<< "${TARGET}"; then
            verify="require"
            cert_dir="/usr/local/apache2/conf"
          fi

          # A CA, a client certificate it accepts and one it can reject
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ca.key -out ca.crt -subj "/CN=mtls-ca"
          for name in client rejected; do
            openssl req -newkey rsa:2048 -nodes \
              -keyout "${name}.key" -out "${name}.csr" -subj "/CN=mtls-${name}"
            openssl x509 -req -days 1 -in "${name}.csr" -CA ca.crt -CAkey ca.key \
              -CAcreateserial -out "${name}.crt"
          done

          # The backend echoes its request headers so the forwarded client
          # identity can be asserted.
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = "\n".join(f"{k}: {v}" for k, v in self.headers.items()).encode()
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass

          HTTPServer(("0.0.0.0", 9999), Handler).serve_forever()
          PY
          echo_pid="${!}"

          echo "Starting container ${TARGET}-mtls-test with SSL_VERIFY=${verify}"
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-mtls-test" \
            --env-file "${TARGET}.env" \
            --add-host host.docker.internal:host-gateway \
            -e BACKEND=http://host.docker.internal:9999 \
            -e SSL_VERIFY="${verify}" \
            -e SSL_CLIENT_CA_CERT_FILE="${cert_dir}/ca.crt" \
            -v "${PWD}/ca.crt:${cert_dir}/ca.crt:ro" \
            -p 8081:8080 \
            -p 8444:8443 \
            "${TARGET}-verification"

          ./tests/verify-mtls.sh \
            --url https://localhost:8444 \
            --client-cert client.crt \
            --client-key client.key \
            --expect-dn "CN=mtls-client"

          # client-supplied identity headers must not reach the backend
          if ! body="$(curl -sf \
            -H "X-SSL-Client-DN: CN=forged-dn" -H "X-SSL-Client-Verify: forged-verify" \
            http://localhost:8081/)"; then
            echo "plain HTTP request to the mTLS container failed" >&2
            exit 1
          fi
          if grep -qiF "forged" <<< "${body}"; then
            echo "forged identity headers reached the backend" >&2
            exit 1
          fi

          docker rm -f "${TARGET}-mtls-test"

          echo "Starting container ${TARGET}-mtls-noca-test without CA certificates"
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-mtls-noca-test" \
            --env-file "${TARGET}.env" \
            -e BACKEND=http://localhost:9999 \
            -e SSL_VERIFY="${verify}" \
            "${TARGET}-verification"

          timeout 60 docker wait "${TARGET}-mtls-noca-test" >/dev/null || true
          if [ "$(docker inspect -f '{{.State.Running}}' "${TARGET}-mtls-noca-test")" != "false" ] \
            || [ "$(docker inspect -f '{{.State.ExitCode}}' "${TARGET}-mtls-noca-test")" = "0" ]; then
            echo "expected the container to refuse to start without CA certificates" >&2
            docker logs "${TARGET}-mtls-noca-test" >&2
            exit 1
          fi
          # the message goes to the container's stderr
          docker logs "${TARGET}-mtls-noca-test" 2>&1 | grep -q "requires SSL_CLIENT_CA_CERT_FILE"
          docker rm -f "${TARGET}-mtls-noca-test"

          # optional_no_ca accepts any client certificate: its claimed
          # identity must not reach the backend, only the verification result
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout selfsigned.key -out selfsigned.crt -subj "/CN=mtls-selfsigned"

          echo "Starting container ${TARGET}-mtls-unverified-test with SSL_VERIFY=optional_no_ca"
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-mtls-unverified-test" \
            --env-file "${TARGET}.env" \
            --add-host host.docker.internal:host-gateway \
            -e BACKEND=http://host.docker.internal:9999 \
            -e SSL_VERIFY=optional_no_ca \
            -p 8081:8080 \
            -p 8444:8443 \
            "${TARGET}-verification"

          for _ in $(seq 1 30); do
            if curl -sk --max-time 5 --cert selfsigned.crt --key selfsigned.key \
              https://localhost:8444/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! body="$(curl -sfk --cert selfsigned.crt --key selfsigned.key \
            https://localhost:8444/)"; then
            echo "optional_no_ca did not answer a self-signed client certificate" >&2
            exit 1
          fi
          if grep -qiF "x-ssl-client-dn:" <<< "${body}"; then
            echo "the claimed identity of an unverified client certificate reached the backend" >&2
            exit 1
          fi
          grep -qiF "x-ssl-client-verify:" <<< "${body}"
          docker rm -f "${TARGET}-mtls-unverified-test"

          # CRL revocation (both variants): SSL_CLIENT_CA_REVOCATION_CHECK is
          # deliberately left unset to cover its default to chain when a
          # revocation file is configured
          mkdir -p ca-db/newcerts
          touch ca-db/index.txt
          echo 1000 > ca-db/serial
          echo 1000 > ca-db/crlnumber
          cat > ca.cnf <<'EOF'
          [ca]
          default_ca = CA_default
          [CA_default]
          database = ./ca-db/index.txt
          new_certs_dir = ./ca-db/newcerts
          serial = ./ca-db/serial
          crlnumber = ./ca-db/crlnumber
          default_md = sha256
          default_days = 1
          default_crl_days = 1
          policy = policy_anything
          [policy_anything]
          commonName = supplied
          EOF
          openssl ca -batch -config ca.cnf -cert ca.crt -keyfile ca.key \
            -revoke rejected.crt
          openssl ca -batch -config ca.cnf -cert ca.crt -keyfile ca.key \
            -gencrl -out ca.crl

          echo "Starting container ${TARGET}-mtls-revoked-test with SSL_CLIENT_CA_REVOCATION_FILE"
          docker run \
            --pull "never" \
            -d \
            --name "${TARGET}-mtls-revoked-test" \
            --env-file "${TARGET}.env" \
            --add-host host.docker.internal:host-gateway \
            -e BACKEND=http://host.docker.internal:9999 \
            -e SSL_VERIFY="${verify}" \
            -e SSL_CLIENT_CA_CERT_FILE="${cert_dir}/ca.crt" \
            -e SSL_CLIENT_CA_REVOCATION_FILE="${cert_dir}/ca.crl" \
            -v "${PWD}/ca.crt:${cert_dir}/ca.crt:ro" \
            -v "${PWD}/ca.crl:${cert_dir}/ca.crl:ro" \
            -p 8081:8080 \
            -p 8444:8443 \
            "${TARGET}-verification"

          ./tests/verify-mtls.sh \
            --url https://localhost:8444 \
            --client-cert client.crt \
            --client-key client.key \
            --rejected-cert rejected.crt \
            --rejected-key rejected.key

          docker rm -f "${TARGET}-mtls-revoked-test"

          kill "${echo_pid}"

      - name: Container logs
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker logs "${TARGET}-test" || true
          docker logs "${TARGET}-http3-test" || true
          docker logs "${TARGET}-mtls-test" || true
          docker logs "${TARGET}-mtls-missing-test" || true
          docker logs mtls-backend || true

      - name: Checkout CRS
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 1
          repository: coreruleset/coreruleset
          path: crs
          persist-credentials: false
      - name: "Install go-ftw"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd crs
          # ftw runs on the runner, so its architecture decides the asset. Asking the
          # runner keeps this from drifting apart from the runs-on mapping, and an
          # architecture with no release fails here rather than on the first exec.
          case "$(uname -m)" in
            x86_64) arch="amd64" ;;
            aarch64 | arm64) arch="arm64" ;;
            *) echo "No go-ftw release for runner architecture $(uname -m)" >&2; exit 1 ;;
          esac
          # The release CDN resets connections now and then. Download to a file so a
          # truncated transfer fails here instead of reaching tar, and retry it.
          archive="ftw_${GO_FTW_VERSION}_linux_${arch}.tar.gz"
          for attempt in 1 2 3; do
            if gh release download -R coreruleset/go-ftw "v${GO_FTW_VERSION}" \
                 -p "${archive}" --clobber; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Giving up on ${archive} after ${attempt} attempts"
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Download failed, retrying in ${delay} seconds"
            sleep "${delay}"
          done
          tar -xzf "${archive}" ftw
          rm "${archive}"
      - name: Patch CRS compose file to use verification image
        run: |
          sed -i \
            's#image: owasp/modsecurity-crs:${{ contains(matrix.target, 'apache') && 'apache' || 'nginx' }}.*#image: ${{ matrix.target }}-verification#' \
            crs/tests/docker-compose.yml
      - name: Patch nginx overrides for nginx 1.30.0 (920100-4 now returns 405)
        run: |
          yq e -i '(.test_overrides[] | select(.rule_id == 920100 and .test_ids[0] == 4 and (.test_ids | length) == 1) | .output.status) = 405' \
            crs/tests/regression/nginx-overrides.yaml
      - name: Pin the CRS test container to a single nginx worker
        # go-ftw bounds the log output of a request with markers. Several workers
        # flush their buffers independently, so lines interleave and tests such as
        # 956100 fail at random (https://github.com/coreruleset/go-ftw/issues/473).
        # This applies to the test setup only; the images still default to "auto".
        run: |
          yq e -i '.services.modsec3-nginx.environment.NGINX_WORKER_PROCESSES = "1"' \
            crs/tests/docker-compose.yml
      - name: Run CRS tests for ${{ matrix.target }}
        # Log flushing isn't reliable enough for go-ftw (https://github.com/coreruleset/go-ftw/issues/473)
        if: ${{!contains(matrix.target, 'nginx-alpine')}}
        run: |
          cd crs
          modsec_version="${{ contains(matrix.target, 'apache') && 'modsec2-apache' || 'modsec3-nginx' }}"
          backend="${{ contains(matrix.target, 'apache') && 'httpd' || 'nginx' }}"
          mkdir -p "tests/logs/${modsec_version}/{nginx,apache2}"
          docker compose -f ./tests/docker-compose.yml up -d "${modsec_version}"
          sleep 10
          docker compose -f ./tests/docker-compose.yml logs
          if ! [ "$(docker inspect ${modsec_version} --format='{{.State.Running}}')" = "true" ]; then
            echo "Web server failed to start. Aborting."
            exit 1
          fi

          ./ftw check -d tests/regression/tests
          ./ftw run \
            -d tests/regression/tests \
            --log-file "tests/logs/${modsec_version}/error.log" \
            --overrides "tests/regression/${backend}-overrides.yaml" \
            --show-failures-only

      - name: Upload logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ${{ matrix.target }}-error.log
          path: "crs/tests/logs/${{ contains(matrix.target, 'apache') && 'modsec2-apache' || 'modsec3-nginx' }}/error.log"
          retention-days: 7
          overwrite: true
