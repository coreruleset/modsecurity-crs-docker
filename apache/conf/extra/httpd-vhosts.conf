# Apache VirtualHost configuration for both HTTP and SSL

Mutex ${MUTEX}

ProxyErrorOverride ${PROXY_ERROR_OVERRIDE}
ProxyPass / ${BACKEND}/ disablereuse=on
ProxyPassReverse / ${BACKEND}/
ProxyPreserveHost ${PROXY_PRESERVE_HOST}
ProxyRequests off
ProxyTimeout ${PROXY_TIMEOUT}

RemoteIPHeader ${REMOTEIP_HEADER}
RemoteIPInternalProxy ${REMOTEIP_INT_PROXY}

RequestHeader set X-Forwarded-Proto "${REQ_HEADER_FORWARDED_PROTO}"
RequestHeader set X-Real-IP %{REMOTE_ADDR}s
RequestHeader set X-Unique-ID %{UNIQUE_ID}e
# The client certificate identity is only forwarded when the client presented
# a certificate that verified successfully (X-SSL-Client-Verify: SUCCESS):
# the claimed subject of a certificate accepted without verification
# (optional_no_ca) is not an identity. The verification result itself is
# forwarded whenever a certificate was presented. Any client-supplied
# X-SSL-Client-* headers are removed first, so they cannot be forged into the
# backend.
RequestHeader unset X-SSL-Client-DN
RequestHeader unset X-SSL-Client-Verify
RequestHeader set X-SSL-Client-DN %{SSL_CLIENT_S_DN}s "expr=%{SSL:SSL_CLIENT_VERIFY} == 'SUCCESS' && %{SSL:SSL_CLIENT_S_DN} != ''"
RequestHeader set X-SSL-Client-Verify %{SSL_CLIENT_VERIFY}s "expr=%{SSL:SSL_CLIENT_VERIFY} != 'NONE' && %{SSL:SSL_CLIENT_VERIFY} != ''"

Header always set X-Frame-Options "${X_FRAME_OPTIONS}"

RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteEngine on
RewriteRule .* "${BACKEND_WS}%{REQUEST_URI}" [P]

ServerName ${SERVER_NAME}
ServerAdmin ${SERVER_ADMIN}

SSLProxyEngine ${PROXY_SSL}
SSLProxyVerify ${PROXY_SSL_VERIFY}
SSLProxyVerifyDepth ${PROXY_SSL_VERIFY_DEPTH}
SSLProxyCheckPeerName ${PROXY_SSL_CHECK_PEER_NAME}
SSLProxyCACertificateFile ${PROXY_SSL_CA_CERT_FILE}

IncludeOptional conf/extra/httpd-proxy-client-cert.conf

UseCanonicalName on

<VirtualHost *:${PORT}>
  Protocols ${H2_PROTOCOLS}
  H2Direct ${H2_DIRECT}
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well\-known/acme\-challenge/
  RewriteCond %{ENV:APACHE_ALWAYS_TLS_REDIRECT} on
  RewriteRule ^(.*)$ https://%{SERVER_NAME}:${SSL_PORT}$1 [L,R=301]
</VirtualHost>

<VirtualHost *:${SSL_PORT}>
  Protocols ${H2_PROTOCOLS}
  H2Direct ${H2_DIRECT}
  SSLEngine ${SSL_ENGINE}
  SSLCertificateFile ${SSL_CERT_FILE}
  SSLCertificateKeyFile ${SSL_CERT_KEY_FILE}

  SSLVerifyClient ${SSL_VERIFY}
  SSLVerifyDepth ${SSL_VERIFY_DEPTH}
  IncludeOptional conf/extra/httpd-client-ca.conf

  RewriteEngine On
  RewriteCond %{ENV:HSTS_MAX_AGE} !^off$
  RewriteRule .* - [E=HSTS_ENABLED:1]
  Header always set Strict-Transport-Security "max-age=${HSTS_MAX_AGE}" env=HSTS_ENABLED
</VirtualHost>
