name: Auto-release on upstream version bump

on:
  push:
    branches: [main]
    paths:
      - docker-bake.hcl

concurrency:
  # Shared with release.yml so a manual dispatch can't allocate the same tag.
  group: release-tag-creation
  cancel-in-progress: false

permissions: {}

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for tracked upstream version bump
        id: check
        run: |
          set -euo pipefail
          old_sha="${{ github.event.before }}"
          if [ -z "${old_sha//0/}" ]; then
            echo "No previous commit to diff against; skipping."
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version_of() {
            sha=${1}
            variant=${2}
            git show "${sha}:docker-bake.hcl" | awk -v variant="${variant}" '
              $0 ~ "variable \"" variant "\"" { found=1 }
              found && /default *=/ { print; exit }
            '
          }

          bumped=false
          for variant in modsec2-version modsec3-version httpd-version nginx-version; do
            old=$(version_of "${old_sha}" "${variant}")
            new=$(version_of "${{ github.sha }}" "${variant}")
            if [ "${old}" != "${new}" ]; then
              echo "Version bump detected for ${variant}: ${old} -> ${new}"
              bumped=true
            fi
          done
          echo "bumped=${bumped}" >> "${GITHUB_OUTPUT}"

  tag-and-release:
    needs: check-version-bump
    if: needs.check-version-bump.outputs.bumped == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/cut-release.yml

  publish:
    needs: tag-and-release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets:
      dockerhub_user: ${{ secrets.dockerhub_user }}
      dockerhub_token: ${{ secrets.dockerhub_token }}
