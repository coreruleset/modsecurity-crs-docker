---
name: Scan published images
on:
  schedule:
    # Daily. Vulnerabilities are disclosed against images that were already
    # published, so this catches what a pull request scan never can.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # [{"image":"<ghcr image>","slug":"<tag>"},...]
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # ratchet:docker/setup-buildx-action@v4.2.0

      - name: Resolve published images
        id: plan
        run: |
          set -euo pipefail
          # The first tag of a target is its floating tag (e.g. "nginx"). The CRS version
          # variants of a target share it because they also share a base image, so one
          # scan per floating tag covers every published OS package set.
          matrix="$(docker buildx bake --print default | jq -c '
            [.target[].tags | map(select(startswith("ghcr.io/"))) | .[0]]
            | unique | map({image: ., slug: (split(":")[1])})')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  scan:
    name: Scan ${{ matrix.slug }}
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # ratchet:docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reports instead of failing: a fix for a published image means cutting a release,
      # not turning this run red. The findings land in the Security tab.
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # ratchet:aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-${{ matrix.slug }}.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # ratchet:github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.slug }}.sarif
          category: trivy-${{ matrix.slug }}
