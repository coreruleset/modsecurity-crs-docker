# Docker Compose setup for server-side mutual TLS (client certificate
# verification) tests. Run `./tests/setup-mtls.sh <target>` first to generate
# `tests/mtls-certs/` and `tests/.env`.
services:
  mtls-echo:
    image: ${MTLS_IMAGE}
    container_name: mtls-echo
    pull_policy: never
    entrypoint: ["perl", "-MIO::Socket::INET", "-e"]
    command:
      - |
        $$| = 1;
        my $$server = IO::Socket::INET->new(
            LocalAddr => "0.0.0.0",
            LocalPort => 8080,
            Proto     => "tcp",
            Listen    => 16,
            ReuseAddr => 1,
        ) or die $$!;
        while (my $$client = $$server->accept()) {
            my $$body = "";
            while (my $$line = <$$client>) {
                $$line =~ s/\r?\n$$//;
                last if $$line eq "";
                $$body .= "$$line\n" if $$line =~ /:/;
            }
            print $$client "HTTP/1.1 200 OK\r\n"
                . "Content-Type: text/plain\r\n"
                . "Content-Length: " . length($$body) . "\r\n"
                . "Connection: close\r\n\r\n"
                . $$body;
            close $$client;
        }

  mtls-test:
    image: ${MTLS_IMAGE}
    container_name: mtls-test
    pull_policy: never
    depends_on:
      - mtls-echo
    env_file:
      - ${MTLS_ENV_FILE}
    environment:
      BACKEND: http://mtls-echo:8080
      SSL_VERIFY: ${SSL_VERIFY}
      SSL_CLIENT_CA_CERT_FILE: ${MTLS_CERT_DIR}/ca.crt
    volumes:
      - ./mtls-certs/ca.crt:${MTLS_CERT_DIR}/ca.crt:ro
    ports:
      - "8091:8080"
      - "8444:8443"

  mtls-noca-test:
    image: ${MTLS_IMAGE}
    container_name: mtls-noca-test
    pull_policy: never
    env_file:
      - ${MTLS_ENV_FILE}
    environment:
      BACKEND: http://mtls-echo:8080
      SSL_VERIFY: ${SSL_VERIFY}

  mtls-unverified-test:
    image: ${MTLS_IMAGE}
    container_name: mtls-unverified-test
    pull_policy: never
    depends_on:
      - mtls-echo
    env_file:
      - ${MTLS_ENV_FILE}
    environment:
      BACKEND: http://mtls-echo:8080
      SSL_VERIFY: optional_no_ca
    ports:
      - "8092:8080"
      - "8445:8443"

  mtls-revoked-test:
    image: ${MTLS_IMAGE}
    container_name: mtls-revoked-test
    pull_policy: never
    depends_on:
      - mtls-echo
    env_file:
      - ${MTLS_ENV_FILE}
    environment:
      BACKEND: http://mtls-echo:8080
      SSL_VERIFY: ${SSL_VERIFY}
      SSL_CLIENT_CA_CERT_FILE: ${MTLS_CERT_DIR}/ca.crt
      # SSL_CLIENT_CA_REVOCATION_CHECK is deliberately left unset to verify
      # that a configured revocation file defaults the check to chain.
      SSL_CLIENT_CA_REVOCATION_FILE: ${MTLS_CERT_DIR}/ca.crl
      SSL_CLIENT_HEADER_PREFIX: X-TLS-
    volumes:
      - ./mtls-certs/ca.crt:${MTLS_CERT_DIR}/ca.crt:ro
      - ./mtls-certs/ca.crl:${MTLS_CERT_DIR}/ca.crl:ro
    ports:
      - "8093:8080"
      - "8446:8443"
